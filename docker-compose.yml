services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contextflow-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - PORT=8000
      - SQLITE_DB_PATH=/app/data/db.sqlite3
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-contextflow-secret-key-2026}
    volumes:
      - contextflow_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: contextflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend



volumes:
  contextflow_data:
    name: contextflow_data
